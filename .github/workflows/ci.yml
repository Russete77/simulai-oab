name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run type check
        run: npx tsc --noEmit

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm run test

      # Sem `npm run build` de proposito. O build precisa de banco de verdade
      # — /gabarito/[slug] falha ao coletar dados sem ele — e dar credencial
      # do banco de producao ao CI e pior do que nao buildar aqui. Quem cobre
      # isso e a Vercel, que builda toda PR e todo push na main com o env
      # real. Este CI cuida do que da pra checar sem segredo nenhum.
